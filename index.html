<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tim Meniere</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Inter',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0a0a0a;
  position:relative;
  overflow:hidden;
}
.bg{
  position:absolute;inset:0;
  background-image:url('https://images.unsplash.com/photo-1508009603885-50cf7c579365?w=1920&q=80');
  background-size:cover;
  background-position:center;
  filter:brightness(.45);
}
.card{
  position:relative;
  z-index:1;
  text-align:center;
  padding:48px 32px;
  max-width:360px;
  width:100%;
}
.name{
  font-size:28px;
  font-weight:700;
  color:#fff;
  letter-spacing:.02em;
  margin-bottom:6px;
}
.sub{
  font-size:13px;
  font-weight:300;
  color:rgba(255,255,255,.55);
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-bottom:40px;
}
.links{
  display:flex;
  flex-direction:column;
  gap:14px;
}
.link-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  padding:16px 24px;
  border-radius:14px;
  text-decoration:none;
  font-size:15px;
  font-weight:600;
  letter-spacing:.02em;
  transition:all .2s;
  border:1.5px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  color:#fff;
}
.link-btn:hover{
  background:rgba(255,255,255,.18);
  border-color:rgba(255,255,255,.35);
  transform:translateY(-2px);
}
.link-btn svg{width:20px;height:20px;flex-shrink:0}
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
  <div class="name">Tim Meniere</div>
  <div class="sub">Bangkok · Content Creator</div>
  <div class="links">
    <a class="link-btn" href="https://www.instagram.com/tim.thld/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r=".5" fill="currentColor" stroke="none"/>
      </svg>
      Instagram
    </a>
    <a class="link-btn" href="https://www.tiktok.com/@tim.thld" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V9.05a8.16 8.16 0 004.77 1.52V7.12a4.85 4.85 0 01-1-.43z"/>
      </svg>
      TikTok
    </a>
  </div>
</div>
</body>
</html>
